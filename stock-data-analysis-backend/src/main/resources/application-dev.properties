server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/trading
spring.datasource.username=trading
spring.datasource.password=TradingPass123!
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=update

springdoc.swagger-ui.url=/v3/api-docs
springdoc.api-docs.path=/v3/api-docs


app.analysis.local-replay-enabled=true

app.analysis.snapshot-daily-limit=200

app.analysis.snapshot-max-input-bytes=4194304
app.analysis.snapshot-max-output-bytes=1048576

# Quartz 僅在整套表不存在時由 QuartzSchemaBootstrap 建立。
spring.quartz.jdbc.initialize-schema=never

# DEV 共用歷史起點；行情與拆股各自使用獨立設定。
history.start-date=2019-01-01
# 首次行情同步從 2016 年開始；既有水位只增量續抓，不刪除歷史資料。
market-history.start-date=2016-01-01
