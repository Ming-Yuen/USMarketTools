server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trading}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.sql-script-encoding=utf-8

spring.jpa.hibernate.ddl-auto=none


app.analysis.local-replay-enabled=false

app.analysis.snapshot-daily-limit=200

app.analysis.snapshot-max-input-bytes=4194304
app.analysis.snapshot-max-output-bytes=1048576

# Quartz 僅在整套表不存在時由 QuartzSchemaBootstrap 建立。
spring.quartz.jdbc.initialize-schema=never
