spring.profiles.default=dev

spring.application.name=stockinsight
spring.config.import=optional:classpath:/config/quartz.properties,optional:file:./config/local-secrets.properties

# Third-party API defaults. Keep actual credentials in Git-ignored config/local-secrets.properties or environment variables.
finnhub.baseUrl=https://finnhub.io/api/v1
finnhub.apiKey=${FINNHUB_API_KEY:}
finnhub.timeout=50000

polygon.baseUrl=https://api.polygon.io/v3/reference
polygon.apiKey=${POLYGON_API_KEY:}

financialmodelingprep.apiKey=${FINANCIALMODELINGPREP_API_KEY:}
marketstack.apiKey=${MARKETSTACK_API_KEY:}

fred.api.base-url=https://api.stlouisfed.org/fred
fred.api.api-key=${FRED_API_KEY:}

sec.user-agent=${SEC_USER_AGENT:}
# 現任 CIK:前任 CIK:接續生效日:SEC 申報編號
sec.issuer-transitions=0002115436:0000034088:2026-07-01:0001193125-26-291990

# 通用歷史資料起點；行情與拆股各自使用獨立設定。
history.start-date=2022-01-01
market-history.start-date=2016-01-01

# OpenAI Responses API; credentials are read from OPENAI_API_KEY.
industry.valuation.ai.endpoint=https://api.openai.com/v1/responses
industry.valuation.ai.model=gpt-6-astra
industry.valuation.ai.reasoning-effort=max
industry.valuation.ai.max-output-tokens=16000
industry.valuation.ai.timeout-seconds=300

# 06_Enhancement 獨立輕量 AI 通道（與高價 industry.valuation.ai.* 完全隔離；預設 NONE 零背景成本，手動複製 Prompt/貼回 JSON 永遠可用）
enhancement.ai.provider=${ENHANCEMENT_AI_PROVIDER:NONE}
enhancement.ai.openai.endpoint=https://api.openai.com/v1/responses
enhancement.ai.openai.model=gpt-5-mini
enhancement.ai.openai.reasoning-effort=low
enhancement.ai.openai.max-output-tokens=4000
enhancement.ai.openai.timeout-seconds=45
enhancement.ai.codex.command=${ENHANCEMENT_AI_CODEX_COMMAND:codex}
enhancement.ai.codex.model=gpt-5-mini
enhancement.ai.codex.reasoning-effort=low
enhancement.ai.codex.timeout-seconds=60

alpaca.trading-base-url=https://paper-api.alpaca.markets
alpaca.options.feed=indicative

alphavantage.base-url=https://www.alphavantage.co
alphavantage.apiKey=${ALPHAVANTAGE_API_KEY:}
alphavantage.earnings-estimates.enabled=true
alphavantage.earnings-estimates.daily-limit=20
alphavantage.earnings-estimates.cache-days=7
alphavantage.earnings-estimates.min-interval-ms=1200
alphavantage.earnings-estimates.timeout-seconds=15

massive.baseUrl=https://api.massive.com
massive.apiKey=${MASSIVE_API_KEY:}
massive.subscription=STARTER

# 行情以 stock_status.quote_date 增量補至最新已收市交易日；水位為 NULL 時從 2016-01-01 開始。
# 拆股每日逐股重讀 Futu 復權資料並更新差異；split_date 僅記實際檢查的生效日範圍。
# 涵蓋 2016 首批估值會使用的較早 SEC 財報期末。
split.history-start-date=2014-01-01

# Futu OpenD connection; opened only by Futu source synchronization.
futu.opend.host=127.0.0.1
futu.opend.port=11111
futu.opend.request-timeout-seconds=20
futu.valuation.requests-per-second=0.9
futu.earnings.requests-per-second=1.8

alpaca.base-url=https://data.alpaca.markets
alpaca.apiKey=${ALPACA_API_KEY:}
alpaca.apiSecret=${ALPACA_SECRET_KEY:}
alpaca.requests-per-minute=180

# DATE 保存業務日期；TIMESTAMP 統一保存 UTC，展示時再轉換時區。
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=com.ykm.stock.analytics.config.StockPostgreSQLDialect
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1000

# Quartz JDBC persistence
spring.quartz.job-store-type=jdbc
spring.quartz.auto-startup=false
spring.quartz.jdbc.platform=postgres
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
spring.quartz.properties.org.quartz.scheduler.instanceName=StockInsightScheduler
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.isClustered=false

app.market-sentiment.enabled=true
app.overview.analysis.extreme-greed=75
app.overview.analysis.extreme-fear=25
app.overview.analysis.rsi-overbought=70
app.overview.analysis.rsi-oversold=30
app.overview.analysis.ma20-extended-percent=3
app.overview.analysis.high-volume-ratio=1.2
app.overview.analysis.low-volume-ratio=1.0




# 只有 DEV 可由 Entity 更新 schema；UAT/PROD 不自動修改資料庫。
spring.jpa.hibernate.ddl-auto=none
spring.quartz.jdbc.initialize-schema=never
spring.sql.init.mode=never
app.quartz.schema-bootstrap.enabled=true

# 富途全市場 CSV 約數 MB；與上傳服務的 10 MB 檔案限制一致。
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
